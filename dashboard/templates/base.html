<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard prospection{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #171a21;
            --border: #2a2e38;
            --text: #e6e8eb;
            --text-dim: #9298a3;
            --accent: #5b8def;
            --green: #3fb872;
            --red: #e5534b;
            --amber: #d9a441;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 32px;
        }
        h1 { font-size: 20px; margin: 0 0 4px; }
        h2 { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 32px 0 12px; }
        .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .funnel { display: flex; gap: 8px; margin-bottom: 32px; flex-wrap: wrap; }
        .funnel-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 90px;
            text-decoration: none;
            color: var(--text);
        }
        .funnel-item.actif { border-color: var(--accent); }
        .funnel-item .count { font-size: 22px; font-weight: 600; }
        .funnel-item .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }

        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.03em; }
        tr:last-child td { border-bottom: none; }
        tr.clickable:hover { background: #1d212b; cursor: pointer; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .badge.nouveau { background: #2a2e38; color: var(--text-dim); }
        .badge.qualifie { background: rgba(63,184,114,0.15); color: var(--green); }
        .badge.disqualifie { background: rgba(229,83,75,0.15); color: var(--red); }
        .badge.contacte { background: rgba(91,141,239,0.15); color: var(--accent); }
        .badge.repondu { background: rgba(217,164,65,0.15); color: var(--amber); }
        .badge.rdv { background: rgba(63,184,114,0.25); color: var(--green); }
        .badge.perdu { background: #2a2e38; color: var(--text-dim); }
        .badge.desinscrit { background: rgba(229,83,75,0.25); color: var(--red); }

        .empty { color: var(--text-dim); font-style: italic; padding: 24px; text-align: center; }
        .back { display: inline-block; margin-bottom: 16px; font-size: 13px; }

        .detail-grid { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; font-size: 13px; }
        .detail-grid dt { margin: 0; color: var(--text-dim); }
        .detail-grid dd { margin: 0; }

        .interaction { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; font-size: 13px; }
        .interaction .meta { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
