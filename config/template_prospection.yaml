# Template de l'email de prospection.
# À REMPLACER par ton vrai message avant tout envoi réel — ce qui est là
# est un placeholder qui te permet de tester la mécanique en attendant.
#
# Variables disponibles : {prenom} {nom} {poste} {entreprise} {secteur}
# {taille_entreprise}. Une variable absente du prospect s'affiche telle
# quelle (ex: {secteur}) plutôt que de faire planter le script.
#
# ⚠️ Cadre légal (France, art. L34-5 CPCE) : un mécanisme de désinscription
# qui fonctionne réellement est obligatoire, pas optionnel. Ici c'est fait
# par "répondre STOP" : agents/email_reader.py (déjà construit) classe
# automatiquement ces réponses en 'desinscription' et exclut le prospect
# de tout envoi futur. Lance email_reader.py régulièrement pour que ce soit
# effectif, pas juste théorique.

objet: "À REMPLIR — exemple : {prenom}, une question sur le pilotage commercial chez {entreprise}"

corps: |
  À REMPLIR — ceci est un template placeholder. Remplace tout ce texte par
  ton vrai message avant d'envoyer quoi que ce soit de réel.

  Bonjour {prenom},

  [Ton accroche ici]

  [Ta proposition de valeur ici]

  [Ton call-to-action ici]

  Cordialement,
  [Ton nom]
  SAMMPO

  ---
  Pour ne plus recevoir de message de notre part, répondez "STOP" à cet email.
